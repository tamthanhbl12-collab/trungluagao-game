];

];

const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys[k]=true;if(k.startsWith('arrow'))e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function arrive(){P.goal=null;if(P.pending){const q=P.pending;P.pending=null;act(q.x,q.y)}}
function movePlayer(dt){
  if(P.inside){if(Object.values(keys).some(Boolean))P.inside=false;else{P.moving=false;return}}
  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  let dx=0,dy=0;
  if(kx||ky){P.goal=null;P.pending=null;const l=Math.hypot(kx,ky);dx=kx/l*190*dt;dy=ky/l*190*dt}
  else if(P.goal){const ex=P.goal.x-P.x,ey=P.goal.y-P.y,dist=Math.hypot(ex,ey);if(dist<6){arrive()}else{const m=Math.min(190*dt,dist);dx=ex/dist*m;dy=ey/dist*m}}
  P.moving=!!(dx||dy);if(dx)P.d=dx>0?1:-1;
  P.x=Math.max(30,Math.min(1250,P.x+dx));P.y=Math.max(335,Math.min(S.scene==='field'?735:548,P.y+dy));

  else if(kx>0&&P.x>=1249&&S.scene==='field')goScene('farm');
}
const LINES=['Lúa năm nay tốt quá!','Trời sắp mưa rồi đấy.','Vịt đẻ trứng chưa em?','Đi ra đồng thôi!','Nhớ nhặt trứng nhé.','Hôm nay mát trời ghê.'];

/* ---------- audio ---------- */
let AC;
function beep(f,d=.1,type='sine',v=.08,f2){
  if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sCoin=()=>{beep(880,.08,'square',.05);setTimeout(()=>beep(1320,.12,'square',.05),70)};
const sPlant=()=>beep(220,.15,'triangle',.1,120);
const sQuack=()=>beep(520,.12,'sawtooth',.04,300);

/* ---------- helpers for hand-drawn look ---------- */
function wob(c,pts,close,w=2.2,col=INK){
  c.beginPath();pts.forEach((p,i)=>{const x=p[0]+(R()-.5)*1.6,y=p[1]+(R()-.5)*1.6;i?c.lineTo(x,y):c.moveTo(x,y)});
  if(close)c.closePath();c.lineWidth=w;c.strokeStyle=col;c.lineJoin='round';c.lineCap='round';
}
function poly(c,pts,fill,w=2.2){wob(c,pts,true,w);if(fill){c.fillStyle=fill;c.fill()}c.stroke()}
function line(c,pts,w=2,col=INK){wob(c,pts,false,w,col);c.stroke()}
function blob(c,x,y,rx,ry,fill,w=2){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);if(fill){c.fillStyle=fill;c.fill()}c.lineWidth=w;c.strokeStyle=INK;c.stroke()}
/* ---- smooth, shaded drawing helpers (nguoi + con vat) ---- */
function shade(h,k){let r,g,b;if(h[0]==='#'){const n=parseInt(h.slice(1),16);r=n>>16;g=n>>8&255;b=n&255}else{[r,g,b]=h.match(/\d+/g).map(Number)}const to=k<0?0:255,a=Math.abs(k);r=Math.round(r+(to-r)*a);g=Math.round(g+(to-g)*a);b=Math.round(b+(to-b)*a);return`rgb(${r},${g},${b})`}
function lg(c,x0,y0,x1,y1,a,b,m){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);if(m)g.addColorStop(.5,m);g.addColorStop(1,b);return g}
function fillP(c,path,fill,w=1.6){c.beginPath();path();c.fillStyle=fill;c.fill();if(w){c.lineWidth=w;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function ell(c,x,y,rx,ry,fill,rot=0,w=1.6){fillP(c,()=>{c.ellipse(x,y,rx,ry,rot,0,7)},fill,w)}
function limb(c,a,b,e,w,col){c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(a[0],a[1]);c.quadraticCurveTo(b[0],b[1],e[0],e[1]);c.lineWidth=w+2.4;c.strokeStyle=OL;c.stroke();c.lineWidth=w;c.strokeStyle=col;c.stroke()}

/* ---------- static scenery (pre-rendered) ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
function leaf(c,x,y,ang,len,w,col,edge){
  const ex=x+Math.cos(ang)*len,ey=y+Math.sin(ang)*len+len*.16,mx=(x+ex)/2,my=(y+ey)/2,nx=-Math.sin(ang)*w,ny=Math.cos(ang)*w;
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(mx+nx,my+ny,ex,ey);c.quadraticCurveTo(mx-nx,my-ny,x,y);c.fillStyle=col;c.fill();
  if(edge){c.lineWidth=.8;c.strokeStyle=edge;c.stroke()}
}
function leafCluster(c,x,y,r,col,R){
  c.fillStyle=shade(col,-.5);c.beginPath();
  const n=18;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r*(.92+R()*.14+.05*Math.sin(i*2.7)),px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*.88;i?c.lineTo(px,py):c.moveTo(px,py)}
  c.closePath();c.fill();
  const cnt=Math.max(30,Math.round(r*r*.5));
  for(let i=0;i<cnt;i++){const a=R()*Math.PI*2,d=Math.sqrt(R()),lx=Math.cos(a)*d,ly=Math.sin(a)*d*.88;
    const light=Math.max(-.45,Math.min(.5,(-lx*.45-ly*.8)*.55+.08+(R()-.5)*.3)),lr=2.4+r*.05+R()*2;
    c.fillStyle=shade(col,light);c.beginPath();c.ellipse(x+lx*r*.96,y+ly*r*.96,lr,lr*.55,R()*3.14,0,7);c.fill()}
  const g=c.createRadialGradient(x-r*.35,y-r*.45,1,x-r*.3,y-r*.4,r*.7);g.addColorStop(0,'rgba(255,255,220,.16)');g.addColorStop(1,'rgba(255,255,220,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
}
function leafClusterOld(c,x,y,r,col,R){
  const hi=shade(col,.3),lo=shade(col,-.38);
  const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.05);g.addColorStop(0,hi);g.addColorStop(.55,col);g.addColorStop(1,lo);
  c.fillStyle=g;c.beginPath();
  const n=16;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r*(.9+R()*.16+.06*Math.sin(i*2.7)),px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*.88;i?c.lineTo(px,py):c.moveTo(px,py)}
  c.closePath();c.fill();c.strokeStyle='rgba(30,60,25,.4)';c.lineWidth=1.4;c.stroke();
  for(let i=0;i<Math.round(r*.45);i++){const a=R()*Math.PI*2,d=Math.sqrt(R())*r*.85;c.globalAlpha=.22;c.fillStyle=R()<.55?hi:lo;c.beginPath();c.ellipse(x+Math.cos(a)*d,y+Math.sin(a)*d*.85,3.2,1.5,R()*3,0,7);c.fill()}
  c.globalAlpha=1;
}

function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}
function float(x,y,text,col='#fff'){fx.push({x,y,text,col,t:0})}
function addMoney(n,x,y){S.money+=n;if(x!=null)float(x,y,(n>0?'+':'')+n,n>0?'#ffe27a':'#ff9a8a')}

function pickGoal(){
  if(S.q>=QUESTS.length)return;
  if(QUESTS[S.q].ok(S)){
    sCoin();toast(`✔ Xong: ${QUESTS[S.q].t}`);S.q++;
    if(S.q>=QUESTS.length){S.won=true;toast('🎉 Bạn đã làm giàu! Cứ chơi tự do nhé');}
  }
}
function updateUI(){
  $('money').textContent=S.money+' đồng';
  const h=Math.floor(S.min/60)%24,m=Math.floor(S.min)%60;
  $('time').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');$('day').textContent=S.day;
  const name=rain>0?'Trời mưa':h<5?'Đêm khuya':h<10?'Sáng sớm':h<14?'Nắng trưa':h<18?'Nghỉ tay':'Chiều tối';
  $('stName').textContent=name;$('stSub').textContent=`vịt ${S.ducks.length} · gà ${S.chicks.length} · cá ${S.fish.length} · heo ${S.pigs.length} · mùa ${SEASON_PAL[season].n}`;$('bPig').disabled=S.money<PIG_COST||S.pigs.length>=MAX_PIG;$('bFish').disabled=S.money<FISH_COST||S.fish.length>=MAX_FISH;
  if(S.q<QUESTS.length){$('qTag').textContent=`MÀN ${S.q+1} · LÀNG QUÊ`;$('qTitle').textContent=QUESTS[S.q].t;$('qHint').textContent=QUESTS[S.q].h}
  else{$('qTag').textContent='HOÀN THÀNH';$('qTitle').textContent='Chơi tự do';$('qHint').textContent='Trồng lúa, nuôi thêm vịt gà, nhặt trứng thoải mái'}
  $('inv').textContent=`Lúa ${S.lua} bao · Gạo ${S.gao} bao`+(S.mill.q+S.mill.out>0?` · máy: ${S.mill.q} chờ, ${S.mill.out} xong`:'');
  $('sign').style.display=$('sign2').style.display=S.scene==='farm'?'':'none';
  $('bDuck').disabled=S.money<DUCK_COST||S.ducks.length>=MAX_PET;$('bChick').disabled=S.money<CHICK_COST||S.chicks.length>=MAX_PET;
}
function buy(kind){
  const list=kind==='duck'?S.ducks:S.chicks,cost=kind==='duck'?DUCK_COST:CHICK_COST;
  if(S.money<cost||list.length>=MAX_PET)return;
  S.money-=cost;list.push({x:rand(840,880),y:rand(470,500),d:-1,w:0,m:false,egg:rand(8,16)});sQuack();pickGoal();
}
function wander(b,dt,minX,maxX,minY,maxY,spd){
  if(b.w>0){b.x+=b.d*spd*dt;b.y+=(b.vy||0)*dt;b.w-=dt;if(b.x<minX){b.x=minX;b.d=1}if(b.x>maxX){b.x=maxX;b.d=-1}b.y=Math.max(minY,Math.min(maxY,b.y))}
  else{b.rest=(b.rest||0)-dt;if(b.rest<=0){b.w=rand(1,3.5);b.d=Math.random()<.5?-1:1;b.vy=rand(-14,14);b.rest=rand(.8,2.5)}}
}
function step(dt){
  S.min+=dt*4;if(S.min>=1440){S.min-=1440;S.day++}
  {const ns=Math.floor((S.day-1)/SEASON_DAYS)%4;if(ns!==season){season=ns;paintBG(ns);paintTown(ns);paintField(ns);toast(SEASON_PAL[ns].msg)}}
  if(fadeT>0)fadeT-=dt;
  {const m=S.mill;if(m.q>0){m.t+=dt*(S.built.mill?2:1);if(m.t>=MILL_T){m.t=0;m.q--;m.out++;S.xay++}}}
  if(rain>0){rain-=dt;if(P.inside)rain-=dt*3;if(rain<=0&&P.inside){P.inside=false;toast('Tạnh mưa rồi, ra ngoài thôi!')}}
  else if(Math.random()<dt*.012*(season===1?3:season===3?.5:1)){rain=rand(25,45);toast('Trời mưa rồi! Mọi người đi trú — bạn bấm vào cửa nhà bên trái để trú mưa');}
  if(S.built.orchard){S.fruitT+=dt;if(S.fruitT>=30){S.fruitT=0;S.fruit=Math.min(4,S.fruit+1)}}
  S.plots.forEach(p=>{if(p.st>0&&p.st<3){p.t+=dt*growMul();if(p.t>=GROW[p.st-1]){p.st++;p.t=0}}});
  S.fields.forEach(p=>{if(p.open&&p.st>0&&p.st<3){p.t+=dt*growMul();if(p.t>=GROW[p.st-1]){p.st++;p.t=0}}});
  S.pigs.forEach(p=>{p.size=Math.min(1,p.size+dt/PIG_GROW);wander(p,dt,675,870,246,276,16)});
  S.fish.forEach(f=>{f.size=Math.min(1,f.size+dt/spOf(f).grow*(S.built.hut?2:1));f.x+=f.d*(22+f.size*8)*dt;f.y+=Math.sin(T*1.3+f.x*.02)*10*dt;
    if(f.x<955){f.x=955;f.d=1}if(f.x>1255){f.x=1255;f.d=-1}f.y=Math.max(580,Math.min(642,f.y));if(Math.random()<dt*.15)f.d=-f.d});
  [[S.ducks,'duck'],[S.chicks,'chick']].forEach(([arr,k])=>arr.forEach(b=>{
    if(rain>0){const tx=Math.max(990,Math.min(1225,b.x)),ty=292,dx=tx-b.x,dy=ty-b.y,m=Math.hypot(dx,dy);
      if(m>3){const sp=k==='duck'?60:55;b.x+=dx/m*sp*dt;b.y+=dy/m*sp*dt;if(Math.abs(dx)>2)b.d=Math.sign(dx);b.w=1}else b.w=0}
    else wander(b,dt,30,1270,420,520,k==='duck'?34:28);
    if(b.m){if(k==='chick'&&Math.random()<dt*.02)float(b.x,b.y-70,'Ò ó o o!','#ffe27a');return}
    b.egg-=dt*(S.built.coop?1.6:1)*(season===0?1.25:season===3?.8:1);
    if(b.egg<=0){b.egg=rand(14,26);if(S.eggs.length<12){S.eggs.push({x:b.x,y:b.y+14,v:(k==='duck'?3:2)*(S.built.coop?2:1)});float(b.x,b.y-60,k==='duck'?'Quạc quạc!':'Cục tác!','#fff')}}
  }));
  vill.forEach(v=>{
    if(rain>0){v.pause=0;const dx=115-v.x,dy=262-v.y;
      if(Math.abs(dx)>4){v.x+=Math.sign(dx)*70*dt;v.d=Math.sign(dx)}
      else if(Math.abs(dy)>3)v.y+=Math.sign(dy)*45*dt;
      else v.inside=true;
      return}
    if(v.inside){v.inside=false}
    if(v.y<340){v.y=Math.min(340,v.y+45*dt);return}
    if(!v.spd)return;if(v.pause>0){v.pause-=dt;return}
    v.x+=v.d*v.spd*dt;if(v.x<80||v.x>1220||Math.random()<dt*.15){if(v.x<80)v.d=1;else if(v.x>1220)v.d=-1;else{v.pause=rand(1.5,4);v.d=Math.random()<.5?-1:1}}
    if(v.sayT>0)v.sayT-=dt});
  movePlayer(dt);
  fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<1.2);
}

/* ---------- render ---------- */
function render(t){
  ctx.drawImage(S.scene==='farm'?bg:S.scene==='town'?bgT:bgF,0,0);
  if(S.scene==='farm'){for(let i=0;i<2;i++)drawPlot(i,t);drawPond(t);edgeSign(1226,452,'Nhà máy ▶');edgeSign(56,500,'◀ Cánh đồng lớn')}else if(S.scene==='field')drawField(t);else drawTown(t);
  // y-sorted actors
  const A=[{y:P.y,f:()=>{if(P.inside)return;drawPerson({x:P.x,y:P.y,d:P.d,hat:P.hat,cloth:P.cloth,pause:0,spd:P.moving?1:0},t);
      ctx.font='15px Itim';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.fillStyle='#fff3b0';ctx.strokeText('▼ Bạn',P.x,P.y-138+Math.sin(t*4)*2);ctx.fillText('▼ Bạn',P.x,P.y-138+Math.sin(t*4)*2)}},
    ...vill.filter(v=>!v.inside).map(v=>({y:v.y,f:()=>{drawPerson(v,t);if(v.sayT>0&&v.say){bubble(v.x,v.y-140,v.say)}}})),
    ...S.pigs.map(p=>({y:p.y,f:()=>drawPig(p,t)})),
    ...BUILD.filter(b=>S.built[b.id]).map(b=>({y:b.y,f:()=>drawBuilding(b,t)})),
    ...S.ducks.map(b=>({y:b.y,f:()=>drawBird(b,t,'duck')})),...S.chicks.map(b=>({y:b.y,f:()=>drawBird(b,t,'chick')}))];
  (S.scene==='farm'?A:[A[0]]).sort((a,b)=>a.y-b.y).forEach(a=>a.f());
  if(S.scene==='farm')S.eggs.forEach(e=>drawEgg(e,t));
  drawAmbient(t);
  {const pl=SEASON_PAL[season];if(pl.tint){ctx.fillStyle=pl.tint;ctx.fillRect(0,0,W,H)}}
  if(P.goal){ctx.strokeStyle='#fff8';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(P.goal.x,P.goal.y+4,16+Math.sin(t*8)*3,6,0,0,7);ctx.stroke()}
  // day/night tint
  const h=(S.min/60)%24;let a=0;
  if(h>=18&&h<20.5)a=(h-18)/2.5*.7;else if(h>=20.5||h<4.5)a=.7;else if(h>=4.5&&h<6.5)a=(6.5-h)/2*.7;
  stage.classList.toggle('night',a>.3);
  if(a>0){ctx.fillStyle=`rgba(8,14,46,${a})`;ctx.fillRect(0,0,W,H);
    if(a>.3){const k=Math.min(1,(a-.3)/.3);
      (S.scene==='farm'?[[115,215],[405,200],[770,255],[1100,205]]:S.scene==='town'?[[300,250],[1010,255]]:[]).forEach(([x,y])=>{const g=ctx.createRadialGradient(x,y,4,x,y,110);g.addColorStop(0,`rgba(255,205,110,${.65*k})`);g.addColorStop(1,'rgba(255,205,110,0)');ctx.fillStyle=g;ctx.fillRect(x-110,y-110,220,220)});
      ctx.fillStyle=`rgba(255,250,220,${k})`;
      for(let i=0;i<60;i++){const sx=(i*197.3)%W,sy=(i*83.7)%185,tw=.5+.5*Math.sin(t*2+i);ctx.globalAlpha=k*tw;ctx.fillRect(sx,sy,2,2)}
      ctx.globalAlpha=k;ctx.beginPath();ctx.arc(300,50,24,0,7);ctx.fillStyle='#fff6d0';ctx.fill();ctx.beginPath();ctx.arc(309,45,21,0,7);ctx.fillStyle='rgba(20,30,70,.85)';ctx.fill();ctx.globalAlpha=1}}
  else if(h>=16&&h<18){ctx.fillStyle=`rgba(255,170,60,${(h-16)/2*.12})`;ctx.fillRect(0,0,W,H)}
  if(fadeT>0){ctx.globalAlpha=Math.min(1,fadeT/.6);ctx.drawImage(snap,0,0);ctx.globalAlpha=1}
  // floating text
  fx.forEach(f=>{ctx.globalAlpha=1-f.t/1.2;ctx.font='26px Itim';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.strokeText(f.text,f.x,f.y-f.t*50);ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y-f.t*50);ctx.globalAlpha=1});
  if(paused){ctx.fillStyle='#0005';ctx.fillRect(0,0,W,H);ctx.font='48px Itim';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Tạm dừng',W/2,H/2)}
}
function bubble(x,y,text){ctx.font='17px Itim';const w=ctx.measureText(text).width+24;ctx.fillStyle='#fffdf5';ctx.strokeStyle=INK;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x-w/2,y-26,w,34,12);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.textAlign='center';ctx.fillText(text,x,y-4)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',ev=>{
  if(paused)return;const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  if(P.inside){P.inside=false;return}
  const door=S.scene==='farm'&&rain>0&&x>=55&&x<=173&&y>=150&&y<=262;
  const tx=door?115:Math.max(30,Math.min(1250,x)),ty=door?335:(S.scene==='field'?Math.max(335,Math.min(735,y+30)):(y>=PY[0]?548:Math.max(335,Math.min(535,y+25))));
  P.pending={x,y};P.goal={x:tx,y:ty};
  if(Math.hypot(P.x-tx,P.y-ty)<45)arrive();
});
function act(x,y){
  if(S.scene==='town'){if(x<=25)goScene('farm');else townAct(x,y);return}
  if(S.scene==='field'){if(x>=1255&&y<740)goScene('farm');else fieldAct(x,y);return}
  if(x>=1255&&y<540){goScene('town');return}
  if(x<=25&&y<540){goScene('field');return}
  if(rain>0&&x>=55&&x<=173&&y>=150&&y<=262){P.inside=true;P.x=115;P.y=300;P.goal=null;P.pending=null;toast('Đang trú mưa trong nhà... (bấm hoặc nhấn phím để ra ngoài)');return}
  // eggs
  for(let i=S.eggs.length-1;i>=0;i--){const e=S.eggs[i];if(Math.hypot(e.x-x,e.y-y)<26){S.eggs.splice(i,1);S.eggsGot++;addMoney(sell(e.v),e.x,e.y);sCoin();pickGoal();return}}
  // plots
  if(y>=PY[0]&&y<=PY[1]&&x>=POND.x0){
    const k=S.fish.findIndex(f=>f.size>=1&&Math.hypot(f.x-x,f.y-y)<40);
    if(k>=0){const f=S.fish.splice(k,1)[0],sp=spOf(f);S.fishCaught++;addMoney(sell(sp.price),f.x,f.y);float(f.x,f.y-34,sp.n,'#fff');sCoin();pickGoal()}else openPanel('fish');
    return}
  if(y>=PY[0]&&y<=PY[1]){const i=PX.findIndex(([a,b])=>x>=a&&x<b),p=S.plots[i];
    if(p.st===0){if(S.money<PLANT_COST){toast('Không đủ tiền mua mạ!');return}S.money-=PLANT_COST;p.st=1;p.t=0;S.planted++;float(x,y,'-'+PLANT_COST,'#ff9a8a');sPlant();pickGoal()}
    else if(p.st===3){p.st=0;p.t=0;S.harvested++;const n=1+(S.built.barn?1:0);S.lua+=n;float(x,y,'+'+n+' bao lúa','#ffe27a');sCoin();pickGoal()}
    return}
  // orchard
  if(S.built.orchard&&S.fruit>0&&x>360&&x<470&&y>370&&y<505){const n=S.fruit;S.fruit=0;addMoney(sell(6*n),x,y);sCoin();return}
  // pigs
  for(let i=S.pigs.length-1;i>=0;i--){const p=S.pigs[i];
    if(Math.abs(p.x-x)<42&&Math.abs(p.y-12-y)<34){
      if(p.size>=1){S.pigs.splice(i,1);S.pigsSold++;addMoney(sell(PIG_PRICE),p.x,p.y-30);sCoin();pickGoal()}
      else{beep(180,.15,'sawtooth',.05,120);float(p.x,p.y-50,'Ụt ịt!','#fff')}
      return}}
  // animals
  for(const [arr,k] of [[S.ducks,'duck'],[S.chicks,'chick']])for(const b of arr)if(Math.abs(b.x-x)<34&&Math.abs(b.y-12-y)<30){sQuack();float(b.x,b.y-40,k==='duck'?'Quạc!':'Cục tác!','#fff');b.w=2;b.d=-b.d;return}
  // villagers
  for(const v of vill)if(Math.abs(v.x-x)<30&&y<v.y&&y>v.y-135){v.say=S.q<QUESTS.length?'Bác mách: '+QUESTS[S.q].h:LINES[Math.floor(Math.random()*LINES.length)];v.sayT=5;v.pause=Math.max(v.pause,5);return}
}
$('bPause').onclick=()=>{paused=!paused;$('bPause').textContent=paused?'▶':'⏸'};
$('bSound').onclick=()=>{soundOn=!soundOn;$('bSound').textContent=soundOn?'🔊':'🔇'};
$('bFish').onclick=()=>openPanel('fish');$('bPig').onclick=buyPig;
$('bBuild').onclick=()=>{const p=$('panel');if(p.style.display==='block'&&panelMode==='build')p.style.display='none';else openPanel('build')};
$('pclose').onclick=()=>{$('panel').style.display='none'};
$('plist').onclick=e=>{const d=e.target.dataset||{};if(d.id)build(d.id);if(d.fish!==undefined)addFish(+d.fish)};$('bDuck').onclick=()=>buy('duck');$('bChick').onclick=()=>buy('chick');
function goFull(){const e=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)return;const f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){try{const p=f.call(e);if(p&&p.catch)p.catch(()=>{})}catch(err){}}}
$('bFull').onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else goFull()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,goFull,{once:true}));
$('bSeason').onclick=()=>{S.day=(Math.floor((S.day-1)/SEASON_DAYS)+1)*SEASON_DAYS+1;S.min=420};
$('bReset').onclick=()=>{if(confirm('Chơi lại từ đầu? Tiến trình hiện tại sẽ mất.')){S=fresh();save()}};

/* ---------- loop ---------- */
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused){T+=dt;step(dt);pickGoal()}
  render(T);updateUI();if($('panel').style.display==='block')renderPanel();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
paintTown(season);paintField(season);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{paintTown(season);paintField(season)});setTimeout(()=>toast('Chào mừng đến Trungluagao (0962.12.08.39)! Bấm để đi tới và làm việc, hoặc dùng phím WASD / mũi tên'),900);
})();
</script>
